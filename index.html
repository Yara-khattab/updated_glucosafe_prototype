<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GlucoSafe — Interactive Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2E5CE6;
    --blue-dark:#0B2A55;
    --blue-light:#EAF0FF;
    --bg:#F4F6FB;
    --card:#FFFFFF;
    --red:#E8473D;
    --red-light:#FDEDEC;
    --green:#2FBE72;
    --green-light:#E6F9EE;
    --orange:#F2A93B;
    --text:#14213D;
    --text-soft:#7C879E;
    --border:#ECEFF5;
    --radius:20px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(160deg,#EEF2FA 0%,#E4E9F5 100%);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:36px;
    padding:40px 20px;
    color:var(--text);
  }
  /* ---------- Phone frame ---------- */
  .phone-shell{
    width:220px;
    height:477px;
    flex:none;
    position:sticky;
    top:40px;
  }
  .phone{
    width:375px;
    height:812px;
    background:#0d1b2e;
    border-radius:48px;
    padding:14px;
    box-shadow:0 30px 60px -20px rgba(11,42,85,0.45), 0 0 0 2px #050b14;
    position:relative;
    transform:scale(0.587);
    transform-origin:top left;
  }
  .notch{
    position:absolute;
    top:14px; left:50%; transform:translateX(-50%);
    width:150px; height:26px;
    background:#0d1b2e;
    border-radius:0 0 18px 18px;
    z-index:20;
  }
  .screen-viewport{
    width:100%; height:100%;
    background:var(--bg);
    border-radius:36px;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  /* CRITICAL FIX: screen-root must stretch to fill the phone and be a column
     flex container itself, otherwise short screens leave dead space at the
     bottom and long screens get clipped instead of scrolling. */
  #screen-root{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .statusbar{
    height:40px; flex:none;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px;
    font-size:14px; font-weight:600;
    color:var(--text);
  }
  .statusbar.on-dark{ color:#fff; }
  .statusbar .icons{ display:flex; gap:5px; align-items:center; font-size:14px; }
  .screen-body{
    flex:1;
    min-height:0;
    overflow-y:auto;
    scrollbar-width:none;
    display:flex;
    flex-direction:column;
  }
  .screen-body::-webkit-scrollbar{display:none;}
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .screen-body{ animation:fadeIn .2s ease; }

  /* ---------- Shared components ---------- */
  .px{ padding-left:22px; padding-right:22px; }
  .top-row{ display:flex; align-items:center; justify-content:space-between; padding:6px 22px 4px; }
  .icon-btn{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--card); color:var(--text);
    border:1px solid var(--border);
    font-size:14px; cursor:pointer;
  }
  .icon-btn.dark{ background:rgba(255,255,255,0.15); color:#fff; border:none; }
  .skip-link{ font-size:14px; font-weight:600; color:var(--blue); cursor:pointer; }
  h1.page-title{ font-size:18px; font-weight:700; }
  .page-header{ display:flex; align-items:center; gap:12px; padding:6px 22px 12px; }
  .page-header .spacer{flex:1;}

  .btn-primary{
    width:100%; padding:14px; border:none; border-radius:16px;
    background:var(--blue); color:#fff; font-size:15px; font-weight:700;
    cursor:pointer; letter-spacing:.2px;
    box-shadow:0 10px 20px -8px rgba(46,92,230,0.55);
  }
  .btn-primary:active{ transform:scale(.98); }
  .btn-outline{
    width:100%; padding:13px; border-radius:16px; background:#fff;
    border:1.5px solid var(--border); color:var(--text); font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .btn-danger-outline{
    width:100%; padding:13px; border-radius:16px; background:#fff;
    border:1.5px solid var(--red); color:var(--red); font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .btn-danger{
    width:100%; padding:14px; border:none; border-radius:16px;
    background:var(--red); color:#fff; font-size:15px; font-weight:700; cursor:pointer;
    box-shadow:0 10px 20px -8px rgba(232,71,61,0.55);
  }
  /* Fields — used by Login (2 fields, can be roomy) and Create Account
     (8 fields, needs to be compact). Base = roomy; .scr-6 overrides below. */
  .field{ margin-bottom:14px; }
  .field label{ font-size:14px; font-weight:600; color:var(--text-soft); margin-bottom:5px; display:block; }
  .field .input-wrap{
    display:flex; align-items:center; gap:10px;
    background:#fff; border:1.5px solid var(--border); border-radius:14px;
    padding:13px 14px;
  }
  .field .input-wrap i{ color:var(--text-soft); font-size:15px; width:16px; text-align:center; }
  .field input{
    border:none; outline:none; flex:1; font-size:15px; font-family:'Inter',sans-serif; color:var(--text); background:transparent;
  }
  .field input::placeholder{ color:#B7C0D1; }
  .scr-6 .field{ margin-bottom:8px; }
  .scr-6 .field label{ font-size:12.5px; margin-bottom:2px; }
  .scr-6 .field .input-wrap{ padding:8px 12px; }
  .scr-6 .field .input-wrap i{ font-size:13.5px; }
  .scr-6 .field input{ font-size:13.5px; }

  .dots{ display:flex; gap:6px; justify-content:center; margin:16px 0 22px; }
  .dots span{ width:7px; height:7px; border-radius:50%; background:#D3DCF2; }
  .dots span.active{ width:20px; border-radius:5px; background:var(--blue); }

  .bottom-nav{
    display:flex; border-top:1px solid var(--border); background:#fff;
    padding:10px 4px 14px; flex:none; margin-top:auto;
  }
  .bottom-nav .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:10.5px; font-weight:600; color:var(--text-soft); cursor:pointer;
  }
  .bottom-nav .nav-item i{ font-size:17px; }
  .bottom-nav .nav-item.active{ color:var(--blue); }

  .card{ background:#fff; border-radius:18px; padding:16px; border:1px solid var(--border); }
  .tag{ font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:20px; flex:none; }
  .tag.normal{ background:var(--green-light); color:var(--green); }
  .tag.high{ background:var(--red-light); color:var(--red); }
  .tag.low{ background:#FFF3E0; color:var(--orange); }

  .toggle{
    width:42px; height:24px; border-radius:14px; background:var(--border);
    position:relative; cursor:pointer; flex:none; transition:.2s;
  }
  .toggle.on{ background:var(--blue); }
  .toggle .knob{
    position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%;
    background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .toggle.on .knob{ left:21px; }

  /* ---------- Onboarding (very little content — sized generously so the
     4 screens use the frame fully, no dead space) ---------- */
  .onb-illustration{
    flex:1; display:flex; align-items:center; justify-content:center; padding:10px 30px;
  }
  .onb-bottom{ padding:0 26px 34px; flex:none; }
  .onb-title{ font-size:27px; font-weight:800; text-align:center; margin-bottom:10px; line-height:1.3; }
  .onb-sub{ font-size:16.5px; color:var(--text-soft); text-align:center; line-height:1.6; margin-bottom:6px; }
  .onb-nav-row{ display:flex; align-items:center; justify-content:center; position:relative; margin-top:8px;}
  .circle-next{
    width:56px; height:56px; border-radius:50%; background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:21px; border:none; cursor:pointer;
    position:absolute; right:0;
    box-shadow:0 10px 20px -8px rgba(46,92,230,0.55);
  }

  /* Splash specific */
  .splash-logo{
    width:130px; height:130px; border-radius:50%; background:var(--blue-light);
    display:flex; align-items:center; justify-content:center; margin:0 auto 24px;
  }
  .splash-logo i{ font-size:54px; color:var(--blue); }

  /* Home current reading card (dense screen: card + 3 stats + status row +
     3 quick-action rows all in one view — kept compact) */
  .reading-card{
    background:linear-gradient(135deg,#0B2A55,#173A73);
    border-radius:20px; padding:16px; color:#fff; margin:6px 22px 12px;
  }
  .reading-card .row1{ display:flex; align-items:center; gap:10px; font-size:14px; opacity:.85; margin-bottom:8px;}
  .reading-value{ font-size:42px; font-weight:800; display:flex; align-items:baseline; gap:8px; }
  .reading-value span{ font-size:15px; font-weight:600; opacity:.75; }
  .stat-row{ display:flex; gap:8px; padding:0 22px 12px; }
  .stat-box{ flex:1; background:#fff; border-radius:14px; padding:10px; border:1px solid var(--border); min-width:0; }
  .stat-box .label{ font-size:11px; color:var(--text-soft); font-weight:600; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat-box .value{ font-size:14.5px; font-weight:700; }

  .device-status-row{
    margin:0 22px 12px; background:#fff; border-radius:14px; padding:11px 14px;
    display:flex; align-items:center; justify-content:space-between; border:1px solid var(--border);
  }
  .quick-item{
    display:flex; align-items:center; gap:12px; padding:11px 14px; background:#fff;
    border:1px solid var(--border); border-radius:14px; margin:0 22px 8px; cursor:pointer; flex:none;
  }
  .quick-item .qicon{
    width:32px; height:32px; border-radius:9px; background:var(--blue-light); color:var(--blue);
    display:flex; align-items:center; justify-content:center; font-size:14px; flex:none;
  }
  .quick-item span.grow{ flex:1; font-size:14.5px; font-weight:600; }

  /* History (dense: tabs + date + graph + 5 rows) */
  .seg-tabs{ display:flex; margin:6px 22px 12px; background:#fff; border-radius:14px; padding:4px; border:1px solid var(--border); flex:none; }
  .seg-tabs .seg{ flex:1; text-align:center; padding:7px 0; border-radius:11px; font-size:14px; font-weight:700; color:var(--text-soft); cursor:pointer; }
  .seg-tabs .seg.active{ background:var(--blue); color:#fff; }
  .date-row{ display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:10px; font-size:14.5px; font-weight:600; color:var(--text-soft); flex:none;}
  .date-row i{ cursor:pointer; color:var(--blue); }
  .graph-wrap{ margin:0 22px 12px; background:#fff; border-radius:16px; padding:14px 10px; border:1px solid var(--border); flex:none; }
  .hist-list{ padding:0 22px; }
  .hist-row{
    display:flex; align-items:center; justify-content:space-between; padding:9px 0;
    border-bottom:1px solid var(--border);
  }
  .hist-row .time{ font-size:13px; color:var(--text-soft); width:62px; flex:none; }
  .hist-row .val{ font-weight:700; font-size:15px; flex:1; text-align:center; }

  /* High alert (sparse — big confident type) */
  .alert-screen{ background:linear-gradient(180deg,#E8473D,#D8362C); color:#fff; }
  .alert-screen .top-row .icon-btn{ background:rgba(255,255,255,.18); color:#fff; border:none; }
  .gauge{
    width:200px; height:200px; border-radius:50%; margin:18px auto 22px;
    background:radial-gradient(closest-side,#fff 68%, transparent 69% 100%),
               conic-gradient(#fff 0deg 320deg, rgba(255,255,255,.28) 320deg 360deg);
    display:flex; align-items:center; justify-content:center; position:relative; flex:none;
  }
  .gauge .inner{ text-align:center; color:var(--red); }
  .gauge .inner .num{ font-size:50px; font-weight:800; line-height:1; }
  .gauge .inner .unit{ font-size:15px; font-weight:700; opacity:.7; }
  .alert-msg{ text-align:center; font-size:18px; font-weight:600; margin-bottom:20px; opacity:.95; }
  .check-list{ background:rgba(255,255,255,.12); border-radius:16px; padding:16px 18px; margin:0 22px 20px; flex:none; }
  .check-list .ci{ display:flex; align-items:center; gap:10px; padding:8px 0; font-size:17px; font-weight:600; }
  .alert-actions{ padding:0 22px; margin-top:auto; padding-bottom:30px; flex:none; }
  .alert-actions .report-link{ text-align:center; margin-top:14px; font-size:15px; font-weight:700; text-decoration:underline; cursor:pointer; }

  /* No response (moderate content, room to breathe) */
  .timeline{ padding:6px 22px 20px; }
  .tl-item{ display:flex; gap:14px; }
  .tl-marker{ display:flex; flex-direction:column; align-items:center; }
  .tl-dot{ width:12px; height:12px; border-radius:50%; background:var(--red); margin-top:4px; flex:none; }
  .tl-dot.pending{ background:var(--orange); }
  .tl-line{ width:2px; flex:1; background:var(--border); margin:4px 0; }
  .tl-content{ padding-bottom:22px; }
  .tl-content .t-title{ font-size:17px; font-weight:700; }
  .tl-content .t-sub{ font-size:14.5px; color:var(--text-soft); margin-top:2px; }
  .warn-icon-wrap{ text-align:center; margin:10px 0 8px; }
  .warn-icon-wrap i{ font-size:58px; color:var(--red); }

  /* Emergency contact (sparse) */
  .contact-card{ margin:6px 22px 18px; background:#fff; border:1px solid var(--border); border-radius:20px; padding:24px; text-align:center; }
  .avatar{ width:82px; height:82px; border-radius:50%; margin:0 auto 14px; background:var(--blue-light); display:flex; align-items:center; justify-content:center; color:var(--blue); font-size:30px; font-weight:700; flex:none; }
  .contact-name{ font-size:21px; font-weight:800; margin-bottom:3px; }
  .contact-sub{ font-size:15px; color:var(--text-soft); margin-bottom:18px; line-height:1.5; }
  .contact-actions{ display:flex; gap:10px; }
  .contact-actions button{ flex:1; padding:13px; border-radius:14px; font-weight:700; font-size:15px; cursor:pointer; border:none; }
  .contact-actions .call{ background:var(--green); color:#fff; }
  .contact-actions .msg{ background:var(--blue-light); color:var(--blue); }
  .note-box{ margin:0 22px 18px; background:var(--blue-light); border-radius:14px; padding:13px 15px; font-size:13.5px; color:var(--blue); font-weight:600; line-height:1.5; }
  .scr-13 .contact-name{ font-size:18px; margin-bottom:2px; }
  .scr-13 .contact-sub{ font-size:13.5px; margin-bottom:0; }

  /* Live location (sparse) */
  .map-box{
    margin:6px 22px 18px; height:280px; border-radius:20px; overflow:hidden; position:relative;
    background: linear-gradient(#DCE8D8,#DCE8D8); flex:none;
  }
  .map-box svg{ width:100%; height:100%; }
  .map-pin{ position:absolute; top:44%; left:48%; transform:translate(-50%,-100%); font-size:38px; color:var(--red); filter:drop-shadow(0 6px 6px rgba(0,0,0,.25)); }
  .last-update{ text-align:center; font-size:15.5px; color:var(--text-soft); margin-bottom:18px; font-weight:600; }

  /* Profile (moderate: avatar + 5 rows + logout) */
  .profile-head{ text-align:center; padding:14px 22px 16px; flex:none; }
  .menu-item{
    display:flex; align-items:center; gap:14px; padding:13px 22px; border-bottom:1px solid var(--border); cursor:pointer;
  }
  .menu-item i.left{ width:18px; color:var(--blue); font-size:17px; }
  .menu-item span.grow{ flex:1; font-size:15.5px; font-weight:600; }
  .menu-item i.chev{ color:var(--text-soft); font-size:13.5px; }

  /* Alert settings (dense: 5 rows, each with title+description) */
  .setting-row{ display:flex; align-items:center; gap:14px; padding:12px 22px; border-bottom:1px solid var(--border); }
  .setting-row .info{ flex:1; }
  .setting-row .info .t{ font-size:16px; font-weight:700; margin-bottom:2px; }
  .setting-row .info .s{ font-size:12.5px; color:var(--text-soft); line-height:1.35; }

  /* Connected device (sparse) */
  .device-card{ margin:12px 22px 18px; background:#fff; border:1px solid var(--border); border-radius:20px; padding:24px; text-align:center; }
  .device-icon{ width:76px; height:76px; border-radius:50%; background:var(--blue-light); color:var(--blue); font-size:30px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
  .device-name{ font-size:20px; font-weight:800; margin-bottom:16px; }
  .device-stats{ display:flex; flex-direction:column; gap:12px; text-align:left; }
  .device-stats .drow{ display:flex; justify-content:space-between; font-size:15px; }
  .device-stats .drow .l{ color:var(--text-soft); font-weight:600; }
  .device-stats .drow .r{ font-weight:700; }

  /* Emergency message preview (long paragraph — keep readable but compact) */
  .msg-preview-note{ text-align:center; font-size:13.5px; color:var(--text-soft); padding:0 30px 14px; font-weight:600; flex:none; }
  .msg-bubble{
    margin:0 22px 18px; background:#fff; border:1px solid var(--border); border-radius:18px; padding:16px;
    font-size:14.5px; line-height:1.65; color:var(--text);
  }
  .msg-bubble b{ font-weight:700; }
  .msg-bubble .safe-line{ color:var(--red); font-weight:700; margin-top:8px; display:block; }

  /* ---------- Screen picker sidebar ---------- */
  .picker{
    width:260px;
    height:477px;
    flex:none;
    background:#fff;
    border-radius:22px;
    border:1px solid var(--border);
    box-shadow:0 12px 30px rgba(0,0,0,.08);
    padding:18px;
    display:flex;
    flex-direction:column;
  }
  .picker h2{ font-size:17px; font-weight:700; margin-bottom:4px; flex:none; }
  .picker p.sub{ font-size:12px; color:var(--text-soft); line-height:1.5; margin-bottom:12px; flex:none; }
  .picker-list{
    flex:1; min-height:0;
    display:flex; flex-direction:column; gap:8px;
    overflow-y:auto; padding-right:6px; margin-top:10px;
  }
  .picker-list::-webkit-scrollbar{ width:6px; }
  .picker-list::-webkit-scrollbar-track{ background:#EEF2FA; border-radius:20px; }
  .picker-list::-webkit-scrollbar-thumb{ background:#2E5CE6; border-radius:20px; }
  .picker-list::-webkit-scrollbar-thumb:hover{ background:#2048bf; }
  .picker-item{
    display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:14px;
    background:#F8FAFF; border:1px solid #E7ECF7; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--text); transition:.2s; flex:none;
  }
  .picker-item:hover{ background:#EDF3FF; border-color:#2E5CE6; }
  .picker-item.active{ background:#2E5CE6; color:#fff; border-color:#2E5CE6; }
  .picker-item .num{
    width:26px; height:26px; border-radius:8px; background:#EAF0FF; color:#2E5CE6;
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; flex:none;
  }
  .picker-item.active .num{ background:rgba(255,255,255,.2); color:#fff; }

  @media (max-width:900px){
    body{ flex-direction:column; align-items:center; }
    .picker{ width:320px; height:400px; order:2; }
  }

  /* ---------- Language ---------- */
  #screen-root.lang-ar{ font-family:'Cairo',sans-serif; }
  #screen-root.lang-ar .btn-primary,
  #screen-root.lang-ar .btn-outline,
  #screen-root.lang-ar .btn-danger,
  #screen-root.lang-ar .btn-danger-outline{ font-family:'Cairo',sans-serif; }

  .lang-switch{
    display:flex; gap:6px; background:#F4F6FB; border-radius:12px; padding:4px; margin-bottom:14px; flex:none;
  }
  .lang-switch .lang-opt{
    flex:1; text-align:center; padding:8px 0; border-radius:9px; font-size:13px; font-weight:700;
    color:var(--text-soft); cursor:pointer; transition:.15s;
  }
  .lang-switch .lang-opt.active{ background:var(--blue); color:#fff; }
</style>
</head>
<body>

  <div class="phone-shell">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen-viewport">
        <!-- ============ SCREEN CONTENT INJECTED BY JS ============ -->
        <div id="screen-root"></div>
      </div>
    </div>
  </div>

  <div class="picker">
    <h2>GlucoSafe — Prototype</h2>
    <div class="picker-list" id="picker-list" style="margin-top: 15px;"></div>
  </div>

<script>
const SCREENS = [
  {id:0, name:"Language Selection"},
  {id:1, name:"Onboarding — GlucoSafe"},
  {id:2, name:"Onboarding — Monitor"},
  {id:3, name:"Onboarding — Alerts"},
  {id:4, name:"Onboarding — Emergency"},
  {id:5, name:"Login"},
  {id:6, name:"Create Account"},
  {id:7, name:"Home"},
  {id:8, name:"History"},
  {id:9, name:"High Blood Sugar Alert"},
  {id:10, name:"No Response Detected"},
  {id:11, name:"Emergency Contact"},
  {id:12, name:"Live Location"},
  {id:13, name:"Profile"},
  {id:14, name:"Alert Settings"},
  {id:15, name:"Connected Device"},
  {id:16, name:"Emergency Message Preview"},
];

let lang = 'en';

const T = {
  chooseLanguage:{en:"Choose Your Language",ar:"اختر اللغة"},
  chooseLanguageSub:{en:"Select your preferred language.",ar:"اختر اللغة التي تريد استخدام التطبيق بها"},
  continueBtn:{en:"Continue",ar:"متابعة"},
  skip:{en:"Skip", ar:"تخطي"},

function tt(key){ return (T[key] && T[key][lang]) || key; }

function statusbar(dark){
  return `<div class="statusbar ${dark?'on-dark':''}">
    <span>9:41</span>
    <span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
  </div>`;
}

function bottomNav(active){
  const items = [
    {k:'home', icon:'fa-house', label:tt('navHome'), goto:7},
    {k:'history', icon:'fa-chart-line', label:tt('navHistory'), goto:8},
    {k:'alerts', icon:'fa-bell', label:tt('navAlerts'), goto:9},
    {k:'profile', icon:'fa-user', label:tt('navProfile'), goto:13},
  ];
  return `<div class="bottom-nav">
    ${items.map(it=>`
      <div class="nav-item ${active===it.k?'active':''}" data-goto="${it.goto}">
        <i class="fa-solid ${it.icon}"></i><span>${it.label}</span>
      </div>`).join('')}
  </div>`;
}

let current = 1;
function showScreen(id){
  current = id;
  const root = document.getElementById('screen-root');
  root.className = 'scr-' + id + ' ' + (lang==='ar' ? 'lang-ar' : 'lang-en');
  root.setAttribute('dir', lang==='ar' ? 'rtl' : 'ltr');
  root.innerHTML = RENDER[id]();
  document.querySelectorAll('[data-goto]').forEach(el=>{
    el.addEventListener('click', ()=> showScreen(parseInt(el.getAttribute('data-goto'))));
  });
  renderPicker();
}

function setLang(l){
  lang = l;

  const en=document.getElementById('lang-btn-en');
  const ar=document.getElementById('lang-btn-ar');

  if(en) en.classList.toggle('active',l==='en');
  if(ar) ar.classList.toggle('active',l==='ar');

  showScreen(current);
}

function renderPicker(){
  const list = document.getElementById('picker-list');
  list.innerHTML = SCREENS.map(s=>`
    <div class="picker-item ${s.id===current?'active':''}" onclick="showScreen(${s.id})">
      <span class="num">${String(s.id).padStart(2,'0')}</span> ${s.name}
    </div>
  `).join('');
}

showScreen(0);
</script>
